name: CI Build

on:
  push:
    branches: [main, master, rust-local-force]
  pull_request:
    branches: [main, master, rust-local-force]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "cmdline-tools;latest" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Flutter pub get
        run: flutter pub get

      - name: Download release keystore
        id: keystore
        continue-on-error: true
        run: |
          set -e
          echo "Downloading release.keystore from 'keystore' release..."
          if ! curl -fL --retry 3 -o /tmp/release.keystore \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/keystore/release.keystore"; then
            echo "keystore release 不存在，使用 debug keystore"
            echo "keystore_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp /tmp/release.keystore android/app/release.keystore
          rm /tmp/release.keystore
          echo "keystore_available=true" >> "$GITHUB_OUTPUT"

      - name: Generate keystore.properties (for CI)
        if: steps.keystore.outputs.keystore_available == 'true'
        run: |
          set -e
          cat > android/keystore.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD:-android}
          keyPassword=${KEY_PASSWORD:-android}
          keyAlias=${KEY_ALIAS:-androiddebugkey}
          storeFile=release.keystore
          EOF
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      # 仅构建标准版 Release APK（arm64-v8a, Skia）
      - name: Flutter build APK (standard, release, arm64-v8a, Skia)
        run: |
          flutter build apk --release --flavor standard --split-per-abi --target-platform android-arm64 \
            --android-project-arg=md3EnableImpeller=false \
            --dart-define=APP_VERSION=ci-${{ github.sha }}

      - name: Rename APK to release-ready name
        run: |
          set -euo pipefail
          apk_dir="build/app/outputs/flutter-apk"
          ver="$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | cut -d+ -f1)"
          echo "VER=${ver}" >> "$GITHUB_ENV"
          mv "$apk_dir/app-arm64-v8a-standard-release.apk" "$apk_dir/TianLe-${ver}.apk"
          ls -lh "$apk_dir"/

      - name: Upload standard APK (arm64-v8a, Skia)
        uses: actions/upload-artifact@v4
        with:
          name: 天乐-标准版-64位
          path: build/app/outputs/flutter-apk/TianLe-${{ env.VER }}.apk
          if-no-files-found: error
          retention-days: 7

      - name: Create CI Release
        if: github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ github.sha }}
          name: 天乐 v${{ env.VER }} (${{ github.sha }})
          body: |
            ## 天乐（个人专版）自动构建

            - **TianLe-${{ env.VER }}.apk** — 标准版 64位（Android arm64-v8a，Skia 渲染引擎）
          prerelease: false
          generate_release_notes: false
          files: |
            build/app/outputs/flutter-apk/TianLe-${{ env.VER }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
